org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.16
# 最低 47.4.13（整合包客户端与混合端服务端都是这个版本）：代码用了 ResourceLocation.fromNamespaceAndPath 和构造器注入的 FMLJavaModLoadingContext
forge_version_range=[47.4.13,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.20.1
# Curios 版本与整合包实际安装的一致
curios_version=5.14.1+1.20.1
curios_version_range=[5.14,)
# 植物魔法：只在编译期挂 api 构件（MRU 转换器的魔力输出，可选依赖，mods.toml 不写）；版本和整合包里的一致
botania_version=1.20.1-456-FORGE
# JEI：只在编译期挂 api 构件（配方显示，可选依赖，mods.toml 不写）
jei_version=15.2.0.27
# The unique mod identifier for the mod.
mod_id=essentialcraft5
# The human-readable display name for the mod.
mod_name=EssentialCraft 5 Unofficial
# 源作 EC3 与 EC4U 都是 CC BY-SA 4.0，改编作品必须同协议（ShareAlike），见 LICENSE 与 README
mod_license=CC-BY-SA-4.0
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.flameforge.essentialcraft5
# The authors of the mod.
mod_authors=Roinflam
# 原作者署名是 CC BY-SA 4.0 的强制要求，不能删
mod_credits=Original EssentialCraft 3 and DummyCore by Modbder. EssentialCraft 4 Unofficial and DummyCore Unofficial by TheLMiffy1111, with mrAppleXZ, InfinityStudio and contributors. 1.20.1 port by Roinflam.
# The description of the mod.
# 源质魔法5非官方版：源质魔法4非官方版（源自 Modbder 的源质魔法3）的 1.20.1 非官方移植。
mod_description=An unofficial port of EssentialCraft 4 Unofficial (based on Modbder's EssentialCraft 3) to Minecraft 1.20.1: MRU energy, magical machines, corruption and much more. \u6e90\u8d28\u9b54\u6cd55\u975e\u5b98\u65b9\u7248\uff1a\u6e90\u8d28\u9b54\u6cd54\u975e\u5b98\u65b9\u7248\uff08\u6e90\u81ea Modbder \u7684\u6e90\u8d28\u9b54\u6cd53\uff09\u7684 1.20.1 \u975e\u5b98\u65b9\u79fb\u690d\u3002
