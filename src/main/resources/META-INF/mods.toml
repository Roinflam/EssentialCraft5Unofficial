modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Roinflam/EssentialCraft5Unofficial/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Roinflam/EssentialCraft5Unofficial"
# 图标是矩阵水晶（item/matrix_crystal.png）整数倍放大到深紫底上；像素图，关掉缩放模糊
logoFile="essentialcraft5_logo.png"
logoBlur=false
authors="${mod_authors}"
credits="${mod_credits}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 原作的 Baubles 饰品（MRU 储存戒指等）全部改走 Curios
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="${curios_version_range}"
    ordering="NONE"
    side="BOTH"
